function plotData(data, V0) {
  const x = data.map(p => p[0]);
  const y = data.map(p => p[1]);

  const scale = 36;
  const eng = 16;

  Plotly.newPlot('plot', [{
    x: x,
    y: y,
    mode: 'lines',
    line: {color: 'orange'},
    name: 'Re(ψ)'
   },
  {
    x: [-5, 5],
    y: [-1.5*scale, 1.5*scale],  // full energy range
    yaxis: 'y2',
    mode: 'lines',
    line: {width: 0},
    showlegend: false,
    hoverinfo: 'skip'
  }], {
	showlegend: false,
    xaxis: {title: 'x', range: [-5, 5]},
    yaxis: {title: 'Re(ψ)', range: [-1.5, 1.5]},

yaxis2: {
  title: 'Energy',
  overlaying: 'y',
  side: 'right',
  anchor: 'x',
  range: [eng-1.5*scale, eng + 1.5*scale],
  //tickvals: [eng-36, eng-18, eng, eng+18, eng+36],
  zeroline: false,   // no horizontal zero line,
  showticklabels: false,
  ticklen: 0,
  showgrid: false 
},

    shapes: [
      // barrier walls
      {type: 'line', x0: -1, x1: -1, y0: -1.5, y1: 1.5, line: {dash: 'dash'}},
      {type: 'line', x0: 1, x1: 1, y0: -1.5, y1: 1.5, line: {dash: 'dash'}},

      // energy line (scaled)
      {type: 'line', x0: -5, x1: 5, y0: 0, y1: 0,
       line: {color: 'red'}},

      // barrier height (scaled)
      {type: 'line', x0: -1, x1: 1, y0: (V0-eng)/scale, y1: (V0-eng)/scale,
       line: {color: 'blue'}},

      // barrier height (scaled)
      {type: 'line', x0: -5, x1: -1, y0: (0-eng)/scale, y1: (0-eng)/scale,
       line: {color: 'blue'}},

      // barrier height (scaled)
      {type: 'line', x0: 1, x1: 5, y0: (0-eng)/scale, y1: (0-eng)/scale,
       line: {color: 'blue'}},

      // barrier walls
      {type: 'line', x0: -1, x1: -1, y0: (0-eng)/scale, y1: (V0-eng)/scale, line: {color: 'blue'}},
      {type: 'line', x0: 1, x1: 1,   y0: (0-eng)/scale, y1: (V0-eng)/scale, line: {color: 'blue'}}

    ]
,

     annotations: [
    {
      x: 4,
      y: 0.1,   // shifted above the line
      text: 'E = 16',
      showarrow: false,
      font: {color: 'red'}
    },
    {
      x: 0,
      y: (V0-eng)/scale + 0.1,   // shifted above the line
      text: 'U = ' + V0,
      showarrow: false,
      font: {color: 'blue'}
    },
    {
      x: 4,
      y: (0-eng)/scale + 0.1,   // shifted above the line
      text: 'U = 0',
      showarrow: false,
      font: {color: 'blue'}
    }
   ]
  });
}

// default plot
plotData(data18, 18);
